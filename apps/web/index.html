<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#eeebe3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Light or dark before the first paint (no flash): the saved choice, or the phone's setting. See src/lib/theme.ts.
      try {
        var t = JSON.parse(localStorage.getItem('klk.settings') || '{}').theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141311');
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="Zombie Run" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Zombie Run: an outdoor infection-tag game for adults in Kochi." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Zombie Run</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
